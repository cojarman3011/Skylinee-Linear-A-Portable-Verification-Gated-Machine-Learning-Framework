name: Skylinee Linear CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e '.[train]' ruff
      - name: Lint
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q skylinee_linear
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce original regression example
        run: python examples/recreate_classroom.py
